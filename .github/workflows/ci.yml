name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnuma-dev clang-format-18

      - name: Build
        run: make -C src

      - name: Build (logging variant)
        run: make -C src logging

      - name: Brace-style check
        run: make -C src check-style

      - name: clang-format check
        run: make -C src check-format CLANG_FORMAT=clang-format-18

      - name: PEBS startup failure regression
        run: make -C src test-pebs-startup

      - name: Log-level filtering regression
        run: make -C src test-log-levels

      - name: Sampling deadline regression
        run: make -C src test-sampling-window

      - name: Thread counter coverage regression
        run: make -C src test-thread-coverage

      - name: Reject incomplete task scans
        run: make -C src test-task-scan-error

      - name: Thread exit during the counter refresh
        run: make -C src test-thread-exit

      - name: Workload exit regression
        run: make -C src test-workload-exit

      - name: Workload with every thread gone
        run: make -C src test-workload-gone

      - name: PEBS quality accounting regression
        run: make -C src test-pebs-quality

      - name: CHA counter freshness regression
        run: make -C src test-cha-freshness

      - name: PMU control failure regression
        run: make -C src test-pmu-control

      - name: Bin-index bounds regression
        run: make -C src test-bin-index

      - name: Quartile selection regression
        run: make -C src test-binning

      - name: PAC distribution arithmetic regression
        run: make -C src test-pac-stats

      - name: PAC threshold diagnostic regression
        run: make -C src test-pac-threshold

      - name: Quiet statistics regression
        run: make -C src test-quiet-stats

      - name: Workload startup and metadata limits
        run: make -C src test-startup-alloc test-pool-limit test-pool-fallback

      - name: Workload startup and metadata limits (logging variant)
        run: make -C src test-startup-alloc test-pool-limit test-pool-fallback CC="gcc -DPACT_ENABLE_LOGGING"

      - name: Literal workload paths
        run: python3 tests/test-workload-paths.py

      - name: Migration worker startup and lifecycle
        run: make -C src test-event-loop-startup test-migration-stop test-migration-wakeup test-migration-wait-stress

      - name: Migration worker startup (logging variant)
        run: PACT_TEST_LOGGING=1 make -C src test-event-loop-startup

      - name: Migration worker lifecycle (logging variant)
        run: make -C src test-migration-stop test-migration-wakeup test-migration-wait-stress CC="gcc -DPACT_ENABLE_LOGGING"

      - name: Migration status recovery regression
        run: make -C src test-migration-recovery

      - name: Mode options and workload rules
        run: make -C src test-cli-modes

      - name: Tierce admission (reservoir bar and epochs)
        run: make -C src test-tierce-admission

      - name: Tierce per-CPU counters and workload MLP
        run: make -C src test-workload-mlp

      - name: Tierce round-robin migration
        run: make -C src test-domain-round-robin

      - name: Tierce sampling, stall scalar and LDLAT
        run: make -C src test-tierce-sampling

      - name: LDLAT-Dyn governor
        run: make -C src test-ldlat-dyn

      - name: LLC way controller
        run: make -C src test-cat-control

      - name: LLC way controller start
        run: make -C src test-cat-start

      - name: Migration trace
        run: make -C src test-migration-trace

      - name: Diagnostics build (make DIAG=1)
        run: make -C src test-diag-build

      - name: Workload cgroups and demotion counters
        run: make -C src test-cgroup

      - name: PACT global instance with several workloads
        run: make -C src test-pact-global
